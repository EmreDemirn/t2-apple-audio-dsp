context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 ]
}

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "MacBook Pro T2 DSP Speakers (4-CH Rev.)"
            media.name       = "MacBook Pro T2 DSP Speakers (4-CH Rev.)"
            filter.graph = {
                nodes = [
                    { type = lv2
                      name = bass
                      plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
                      control = {
                        level_in = 1.0
                        level_out 1.0
                        amount = 0.9
                        drive = 8.5
                        blend = -10.0
                        freq = 120
                        listen = 0
                        floor_active = 1
                        floor = 40
                      }
                    }
                    {
                        type = lv2
                        plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        name = compressor
                        control = {
                            mode = 1
                            bypass = 0
                            g_in = 1.0
                            g_out = 8.0
                            g_dry = 0.0
                            g_wet = 1.0
                            bsel = 0
                            flt = 1
                            ife_l = 0
                            ofe_l = 0
                            ife_r = 0
                            ofe_r = 0
                            ce_0 = 1
                            al_0 = 0.501187
                            at_0 = 0.0
                            rrl_0 = 0.00001
                            rt_0 = 750.0
                            cr_0 = 2.0
                            kn_0 = 0.501187
                            mk_0 = 1.0
                            sla_0 = 10.0
                            bs_0 = 0
                            bm_0 = 0
                            cbe_1 = 1
                            ce_1 = 1
                            sf_1 = 100
                            al_1 = 0.251189
                            at_1 = 0.0
                            rrl_1 = 0.00001
                            rt_1 = 750
                            cr_1 = 2.0
                            kn_1 = 0.251197
                            sla_1 = 10.0
                            mk_1 = 5.0
                            bs_1 = 0
                            bm_1 = 0
                            cbe_2 = 1
                            ce_2 = 1
                            sf_2 = 500
                            al_2 = 0.251189
                            at_2 = 0.0
                            rrl_2 = 0.00001
                            rt_2 = 750.0
                            cr_2 = 2.0
                            kn_2 = 0.251197
                            mk_2 = 4.5
                            sla_2 = 10.0
                            bs_2 = 0
                            bm_2 = 0
                            cbe_7 = 1
                            ce_7 = 1
                            sf_7 = 3000
                            al_7 = 0.251189
                            at_7 = 0.00001
                            rrl_7 = 750.0
                            cr_7 = 2.5
                            kn_7 = 0.251197
                            mk_7 = 3.0
                            sla_7 = 10.0
                            bs_7 = 0
                            bm_7 = 0
                            cbe_3 = 0
                            cbe_4 = 0
                            cbe_5 = 0
                            cbe_6 = 0
                        }
                    }

                    # Left Tweeter
                    {
                        type = builtin
                        label = convolver
                        name = convLT
                        config = {
                            filename = [/usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_tweeters_4-44k.wav,
                                         /usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_tweeters_4-48k.wav,
                                         /usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_tweeters_4-96k.wav]
                            channel = 0
                        }
                    }
                    # Right Tweeter
                    {
                        type = builtin
                        label = convolver
                        name = convRT
                        config = {
                            filename = [/usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_tweeters_4-44k.wav,
                                         /usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_tweeters_4-48k.wav,
                                         /usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_tweeters_4-96k.wav]
                            channel = 0
                        }
                    }
                    # Left Woofer
                    {
                        type = builtin
                        label = convolver
                        name = convLW
                        config = {
                            filename = [/usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_woofers_4-44k.wav,
                                         /usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_woofers_4-48k.wav,
                                         /usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_woofers_4-96k.wav]
                            channel = 0
                        }
                    }
                    # Right Woofer
                    {
                        type = builtin
                        label = convolver
                        name = convRW
                        config = {
                            filename = [/usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_woofers_4-44k.wav,
                                         /usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_woofers_4-48k.wav,
                                         /usr/share/pipewire/devices/apple/macbook_pro_t2_16_1_woofers_4-96k.wav]
                            channel = 0
                            gain = 1.0
                        }
                    }
                    { type = builtin label = copy name = inputL }
                    { type = builtin label = copy name = inputR }
                    { type = builtin label = copy name = LW }
                    { type = builtin label = copy name = LT }
                    { type = builtin label = copy name = RW }
                    { type = builtin label = copy name = RT }
                ]

                links = [
                    # Bass -> Compressor
                    { output = "bass:out_l" input = "compressor:in_l"}
                    { output = "bass:out_r" input = "compressor:in_r"}

                    # Sinyal burada 4 kanala cogaltilir
                    { output = "compressor:out_l" input = "convLT:In"}
                    { output = "compressor:out_l" input = "convLW:In"}
                    { output = "compressor:out_r" input = "convRT:In"}
                    { output = "compressor:out_r" input = "convRW:In"}
                    
                    # Convolver -> Cikis Kopyalari
                    { output = "convLW:Out" input = "LW:In"}
                    { output = "convLT:Out" input = "LT:In"}
                    { output = "convRW:Out" input = "RW:In"}
                    { output = "convRT:Out" input = "RT:In"}
                ]

                inputs = [ "bass:in_l" "bass:in_r" ]
                
                # Cikis Siralamasi: Woofer L, Tweeter L, Tweeter R, Woofer R
                outputs = [
                    "LW:Out"
                    "RW:Out"
		    "LT:Out"
                    "RT:Out"
                ]
            }
            capture.props = {
                node.name = "effect_input.filter-chain-speakers"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }

            playback.props = {
                node.name = "effect_output.filter-chain-speakers"
                node.target = "alsa_output.pci-0000_04_00.3.Speakers"
                node.passive = true
                audio.channels = 4
                audio.position = [ FL FR RL RR ]
            }
        }
    }
]
