context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 ]
}

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "MacBook Pro T2 DSP Speakers"
            media.name       = "MacBook Pro T2 DSP Speakers"
            filter.graph = {
                nodes = [
                    {
                        "type": "lv2",
                        "plugin": "https://chadmed.au/bankstown",
                        "name": "virtualbass",
                        "control": {
                            "bypass": 0,
                            "amt": 1.0,
                            "sat_second": 1.5,
                            "sat_third": 2.0,
                            "blend": 1.0,
                            "ceil": 150.0,
                            "floor": 60.0,
                        }
                    }
                    {
                    type = lv2
                    plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                    name = compressor
                    control = {
                        # Enable
                        #mode = 1
                        enabled = 1
                        # Preamp volumes
                        g_in = 1.0    # Input gain
                        g_out = 1.0   # Output gain
                        #g_dry = 0.0   # Dry mix
                        #g_wet = 1.0   # Wet mix
                        
                        # Compression Parameters
                        #ce = 1        # Compressor enabled
                        al = 0.1258925 # Attack threshold (-18 dB)
                        at = 20.0     # Attack time [ms]: 0.0..2000.0
                        rrl = 0.00001 # Release threshold [G]: 0.0..63.0957489
                        rt = 200.0    # Release time [ms]: 0.0..5000.0
                        cr = 3.0      # Ratio (6:1): 1.0..100.0
                        kn = 0.251197 # Knee (-12 dB): 0.0631..1.0
                        sla = 10.0    # Sidechain level adjust
                        mk = 8.0      # Makeup gain
                        
                        # Sidechain Parameters (Optional)
                        #sc = 0        # Sidechain input (0: off, 1: on)
                        }
                    }
                    {
                         type   = lv2
                         name   = limiter
                         plugin = "http://plugin.org.uk/swh-plugins/fastLookaheadLimiter"
                         control = {
                         ingain = 0
                         limit = -1
                         release = 0.8
                         }
                    }
                    
                    # Volume control for left channel
                    {
                        type = lv2
                        plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        name = ell
                        control = {
                            enabled = 1
                            input = 1.0
                            fft = 4
                        }
                    }
                    
                    # Volume control for right channel
                    {
                        type = lv2
                        plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        name = elr
                        control = {
                            enabled = 1
                            input = 1.0
                            fft = 4
                        }
                    }
                    
                    # Left Tweeter
                    {
                        type = builtin
                        label = convolver
                        name = convLT
                        config = {
                            filename = ["/usr/share/pipewire/devices/MacBookPro16_1/tweeters-44k.wav",
                                        "/usr/share/pipewire/devices/MacBookPro16_1/tweeters-48k.wav",
                                        "/usr/share/pipewire/devices/MacBookPro16_1/tweeters-96k.wav"]
                            channel = 0
                            gain = 1.0
                        }
                    }

                    # Right Tweeter
                    {
                        type = builtin
                        label = convolver
                        name = convRT
                        config = {
                            filename = ["/usr/share/pipewire/devices/MacBookPro16_1/tweeters-44k.wav",
                                        "/usr/share/pipewire/devices/MacBookPro16_1/tweeters-48k.wav",
                                        "/usr/share/pipewire/devices/MacBookPro16_1/tweeters-96k.wav"]
                            channel = 0
                            gain = 1.0
                        }
                    }

                    # Left Woofer
                    {
                        type = builtin
                        label = convolver
                        name = convLW
                        config = {
                            filename = ["/usr/share/pipewire/devices/MacBookPro16_1/woofers-44k.wav",
                                        "/usr/share/pipewire/devices/MacBookPro16_1/woofers-48k.wav",
                                        "/usr/share/pipewire/devices/MacBookPro16_1/woofers-96k.wav"]
                            channel = 0
                            gain = 1.0
                        }
                    }

                    # Right Woofer
                    {
                        type = builtin
                        label = convolver
                        name = convRW
                        config = {
                            filename = ["/usr/share/pipewire/devices/MacBookPro16_1/woofers-44k.wav",
                                        "/usr/share/pipewire/devices/MacBookPro16_1/woofers-48k.wav",
                                        "/usr/share/pipewire/devices/MacBookPro16_1/woofers-96k.wav"]
                            channel = 0
                            gain = 1.0
                        }
                    }
                    
                    { type = builtin label = copy name = LW }
                    { type = builtin label = copy name = LW2 }
                    { type = builtin label = copy name = RW }
                    { type = builtin label = copy name = RW2 }
                ]
                
                 

                # Map the inputs to their appropriate convolvers
                links = [
                    { output = "virtualbass:out_l" input = "compressor:in_l"}
                    { output = "virtualbass:out_r" input = "compressor:in_r"}
                    { output = "compressor:out_l" input = "limiter:in_1"}
                    { output = "compressor:out_r" input = "limiter:in_2"}
                    
                    { output = "limiter:out_1" input = "ell:in"}
                    { output = "limiter:out_2" input = "elr:in"}
                    { output = "ell:out" input = "convLT:In"}
                    { output = "ell:out" input = "convLW:In"}
                    { output = "elr:out" input = "convRT:In"}
                    { output = "elr:out" input = "convRW:In"}
                    
                    { output = "convLW:Out" input = "LW:In"}
                    { output = "convRW:Out" input = "RW:In"}
                    { output = "convLW:Out" input = "LW2:In"}
                    { output = "convRW:Out" input = "RW2:In"}
                ]

                inputs = [ "virtualbass:in_l" "virtualbass:in_r" ]
                
                # Volume control configuration
                capture.volumes = [
                    {
                        "control": "ell:volume",
                        "min": -65.0,
                        "max": 0.0,
                        "scale": "cubic"
                    },
                    {
                        "control": "elr:volume",
                        "min": -65.0,
                        "max": 0.0,
                        "scale": "cubic"
                    }
                ]
                
                # changed the outputs order
                # following 16,1 2019 model at /System/Library/Audio/Tunings/Mac-E1008331FDC96864/DSP/Graphs/builtin_speaker_out.dspg
                # [def numChansOut 6] ; rdar://46105807; Mapping Ch 0 - Ch 5; Left woofer 1, left woofer 2, left tweeter, right woofer 1, right woofer 2, right tweeter as of 12/03/18
                outputs = [ 
                            "LW:Out"
                            "LW2:Out"
                            "convLT:Out"
                            "RW:Out"
                            "RW2:Out"
                            "convRT:Out"
                            ]
            }
            capture.props = {
                node.name = "effect_input.filter-chain-speakers"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = ["FL", "FR"]
                device.api = dsp
                audio.allowed-rates = [48000, 44100]
                node.virtual = false
                priority.session = 850
                state.default-volume = 0.75
                device.icon-name = "audio-speakers"
            }

            playback.props = {
                node.name = "effect_output.filter-chain-speakers"
                node.target = "alsa_output.pci-0000_04_00.3.Speakers"
                node.passive = true
                node.hidden = true
                audio.channels = 6
                state.default-volume = 1.0
                audio.position = [ "FL", "SL", "RL", "FR", "SR", "RR" ]
            }
        }
    }
]
